name: Android Release

# Trigger:
#   - Manual dari tab Actions (bisa menentukan tag, arsitektur, AAB, pre-release)
#   - Push tag yang diawali "v" (contoh: git tag v1.0.0 && git push origin v1.0.0)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh: v1.0.0). Kosongkan untuk memakai versi dari app.json.'
        required: false
        type: string
      architectures:
        description: 'ABI yang dibuild (dipisah koma). Default "arm64-v8a" saja agar build tercepat; tambah "armeabi-v7a" bila perlu dukung perangkat 32-bit lama.'
        required: false
        default: 'arm64-v8a'
        type: string
      build_aab:
        description: 'Ikut build AAB (untuk upload ke Google Play)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Tandai rilis sebagai pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

# Diperlukan oleh softprops/action-gh-release untuk membuat release.
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    env:
      # Di-inline Metro saat bundling JS (lihat hooks/useConnection.tsx).
      EXPO_PUBLIC_LIVEKIT_SANDBOX_ID: ${{ secrets.EXPO_PUBLIC_LIVEKIT_SANDBOX_ID }}
      # Keystore rilis. Kalau secret ini kosong, APK tetap dibuat tetapi
      # ditandatangani dengan debug keystore bawaan Expo prebuild.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json', 'android/gradle.properties', 'android/settings.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Increase Gradle memory
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          grep -q '^org.gradle.parallel=' android/gradle.properties || echo 'org.gradle.parallel=true' >> android/gradle.properties
          grep -q '^org.gradle.caching=' android/gradle.properties || echo 'org.gradle.caching=true' >> android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Decode release keystore & enable release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          node scripts/ci/patch-android-signing.mjs android/app/build.gradle

      - name: Warn when no release keystore is configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi. APK akan ditandatangani dengan debug keystore dan tidak bisa dipakai untuk meng-update aplikasi yang sudah terpasang."

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease --stacktrace --parallel --build-cache --max-workers=4 -PreactNativeArchitectures="$ARCHITECTURES"
        working-directory: android

      - name: Build release AAB
        if: ${{ inputs.build_aab }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew bundleRelease --stacktrace --parallel --build-cache --max-workers=4 -PreactNativeArchitectures="$ARCHITECTURES"
        working-directory: android

      - name: Collect artifacts
        id: meta
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./app.json').expo.version")
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/voice-assistant-${VERSION}.apk"
          if compgen -G "android/app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp android/app/build/outputs/bundle/release/*.aab "dist/voice-assistant-${VERSION}.aab"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Job summary
        run: |
          KEYSTORE_STATUS=$([ -n "$ANDROID_KEYSTORE_BASE64" ] && echo 'release keystore (secret)' || echo 'debug keystore (fallback)')
          AGENT_STATUS=$([ -n "$EXPO_PUBLIC_LIVEKIT_SANDBOX_ID" ] && echo 'sandbox token server' || echo 'homepage agent (fallback)')
          {
            echo "## Android release ${{ steps.meta.outputs.tag }}"
            echo ""
            echo "| Item | Nilai |"
            echo "| --- | --- |"
            echo "| Versi app | \`${{ steps.meta.outputs.version }}\` |"
            echo "| ABI | \`$ARCHITECTURES\` |"
            echo "| Signing | ${KEYSTORE_STATUS} |"
            echo "| Agent | ${AGENT_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
